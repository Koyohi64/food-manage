                            background: "#f3fcf0",

                            "secondary-container": "#fd933d",
                            "secondary-fixed-dim": "#ffb783",
                            surface: "#f3fcf0",
                            "inverse-primary": "#4de082",
                            "on-secondary-fixed-variant": "#713700",

                        borderRadius: {

                        },
                        fontFamily: {
                            "body-lg": ["Be Vietnam Pro"],
                            "headline-md": ["Plus Jakarta Sans"],
                            "display-lg": ["Plus Jakarta Sans"],
                            "headline-lg": ["Plus Jakarta Sans"],

    </head>
    <body
        class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop"
    >
        <!-- Main Container -->
        <main
            class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-outline-variant/30 p-xl flex flex-col items-center relative overflow-hidden"
        >
            <!-- Decorative subtle gradient blob -->
            <div
                class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-surface-container-low to-transparent -z-10 rounded-t-2xl"
            ></div>
            <!-- Logo / Icon Area -->
            <div
                class="w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center mb-lg text-primary"
            >
                <span
                    class="material-symbols-outlined text-display-lg"
                    data-icon="lock_reset"
                    data-weight="fill"
                    style="font-variation-settings: &quot;FILL&quot; 1"
                    >lock_reset</span
                >
            </div>
            <!-- Header -->
            <div class="text-center mb-xl w-full">
                <h1
                    class="font-headline-lg text-headline-lg text-on-surface mb-sm"
                >
                    Forgot Password?
                </h1>
                <p
                    class="font-body-md text-body-md text-on-surface-variant px-sm"
                >
                    No worries! Enter your email address below and we'll send
                    you a link to reset your password.
                </p>
            </div>
            <!-- Form -->
            <form action="#" class="w-full flex flex-col gap-lg" method="POST">
                <!-- Email Input -->
                <div class="flex flex-col gap-sm">
                    <label
                        class="font-label-md text-label-md text-on-surface"
                        for="email"
                        >Email Address</label
                    >
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-md text-on-surface-variant pointer-events-none"
                            data-icon="mail"
                            >mail</span
                        >
                        <input
                            class="w-full pl-[48px] pr-md py-[14px] bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow shadow-sm inset-shadow-sm"
                            id="email"
                            name="email"
                            placeholder="chef@zuborakitchen.com"
                            required=""
                            type="email"
                        />
                    </div>
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full py-md bg-primary text-on-primary rounded-xl font-label-md text-label-md hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-sm shadow-md"
                    type="submit"
                >
                    Send Reset Link
                    <span
                        class="material-symbols-outlined text-[18px]"
                        data-icon="arrow_right_alt"
                        >arrow_right_alt</span
                    >
                </button>
            </form>
            <!-- Back to Login Link -->
            <div class="mt-xl text-center">
                <a
                    class="inline-flex items-center gap-xs font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors group"
                    href="#"
                >
                    <span
                        class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform"
                        data-icon="arrow_back"
                        >arrow_back</span
                    >
                    Back to Login
                </a>
            </div>
        </main>
    </body>
</html>
