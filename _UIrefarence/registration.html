<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Sign Up | The Culinary Editorial</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            surface: "#f9f9f8",
                            "on-error": "#ffffff",
                            "tertiary-fixed-dim": "#ffb3ac",
                            "on-secondary": "#ffffff",
                            "surface-variant": "#e1e3e2",
                            "surface-dim": "#d9dad9",
                            "on-secondary-fixed": "#311300",
                            "surface-container-lowest": "#ffffff",
                            "primary-container": "#2e7d32",
                            "error-container": "#ffdad6",
                            "surface-container-high": "#e7e8e7",
                            "on-tertiary-fixed-variant": "#930010",
                            primary: "#0d631b",
                            "secondary-fixed-dim": "#ffb786",
                            "on-tertiary-fixed": "#410003",
                            tertiary: "#ac0c18",
                            "surface-container-highest": "#e1e3e2",
                            "on-primary": "#ffffff",
                            "inverse-surface": "#2e3131",
                            "inverse-on-surface": "#f0f1f0",
                            "primary-fixed-dim": "#88d982",
                            "on-primary-container": "#cbffc2",
                            "on-secondary-fixed-variant": "#723600",
                            "surface-container-low": "#f3f4f3",
                            "outline-variant": "#bfcaba",
                            "primary-fixed": "#a3f69c",
                            "on-tertiary": "#ffffff",
                            "secondary-fixed": "#ffdcc6",
                            "surface-bright": "#f9f9f8",
                            error: "#ba1a1a",
                            "tertiary-fixed": "#ffdad6",
                            secondary: "#964900",
                            "on-surface-variant": "#40493d",
                            "inverse-primary": "#88d982",
                            outline: "#707a6c",
                            "surface-container": "#edeeed",
                            "surface-tint": "#1b6d24",
                            "on-tertiary-container": "#ffedeb",
                            "on-primary-fixed-variant": "#005312",
                            "on-secondary-container": "#5e2c00",
                            "on-error-container": "#93000a",
                            background: "#f9f9f8",
                            "tertiary-container": "#d02d2d",
                            "on-background": "#191c1c",
                            "on-surface": "#191c1c",
                            "secondary-container": "#fc820c",
                            "on-primary-fixed": "#002204",
                        },
                        borderRadius: {
                            DEFAULT: "0.25rem",
                            lg: "0.5rem",
                            xl: "0.75rem",
                            full: "9999px",
                        },
                        fontFamily: {
                            headline: ["Plus Jakarta Sans"],
                            display: ["Plus Jakarta Sans"],
                            body: ["Be Vietnam Pro"],
                            label: ["Be Vietnam Pro"],
                        },
                    },
                },
            };
        </script>
        <style>
            body {
                font-family: "Be Vietnam Pro", sans-serif;
            }
            h1,
            h2,
            h3 {
                font-family: "Plus Jakarta Sans", sans-serif;
            }
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
            .signature-gradient {
                background: linear-gradient(135deg, #0d631b 0%, #2e7d32 100%);
            }
        </style>
    </head>
    <body
        class="bg-surface text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed"
    >
        <main class="min-h-screen flex flex-col md:flex-row overflow-hidden">
            <!-- Left Side: Editorial Visual -->
            <section
                class="hidden md:block md:w-1/2 lg:w-3/5 relative overflow-hidden"
            >
                <img
                    class="absolute inset-0 w-full h-full object-cover"
                    data-alt="Top-down editorial shot of fresh organic produce, leafy greens, and artisan kitchenware on a rustic wooden table with soft morning light"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeatkfxcCs7ZGt8W5Q9ljdSMTJBrVtMS_VCpyYxA-cNq-f4wClNIZfPAF4ot_I49nITtgHC_UaibLXKBx2RNx_4cVLR2f_iKxBoUPXTQT354zA9Vn7C9VdIRdWAR243s_rJUQFgtwHY_ugAWvHd9hRLp7yCaSt63ZOirljSxuXsnl7mrnHBlqiEnEfUctY29NrmZSxkxo_NSHs3wMQ7ZEPWoHgN6KAsfolkkvJwOItpxtHJZs7ZcMHfBIj7o5M0KogJr22k8dpIGBk"
                />
                <div
                    class="absolute inset-0 bg-primary/10 mix-blend-multiply"
                ></div>
                <!-- Branding Overlay -->
                <div class="absolute top-12 left-12">
                    <span
                        class="text-white text-2xl font-extrabold tracking-tighter uppercase"
                        >The Culinary Editorial</span
                    >
                </div>
                <!-- Quote/Context Overlay -->
                <div class="absolute bottom-12 left-12 right-12 max-w-lg">
                    <div
                        class="bg-surface-container-lowest/80 backdrop-blur-xl p-8 rounded-xl shadow-sm"
                    >
                        <p
                            class="text-on-surface font-headline text-2xl font-bold leading-tight mb-4"
                        >
                            "Good cooking is the most effective form of
                            planetary stewardship."
                        </p>
                        <span
                            class="text-primary font-semibold text-sm uppercase tracking-widest"
                            >Est. 2024 — Zero Waste Movement</span
                        >
                    </div>
                </div>
            </section>
            <!-- Right Side: Sign-Up Form -->
            <section
                class="flex-1 flex flex-col justify-center items-center px-6 py-12 md:px-12 lg:px-24 bg-surface"
            >
                <div class="w-full max-w-md space-y-8">
                    <!-- Form Header -->
                    <header class="text-left space-y-2">
                        <h1
                            class="text-3xl md:text-4xl font-extrabold text-on-surface tracking-tight"
                        >
                            Create Your Account
                        </h1>
                        <p class="text-on-surface-variant font-body text-base">
                            Start your journey to a zero-waste, inspired
                            kitchen.
                        </p>
                    </header>
                    <div class="space-y-6">
                        <!-- Google SSO -->
                        <button
                            class="w-full flex items-center justify-center gap-3 py-3.5 px-4 bg-surface-container-lowest border border-outline-variant/15 hover:bg-surface-bright transition-colors rounded-full text-on-surface font-semibold text-sm"
                        >
                            <svg class="w-5 h-5" viewbox="0 0 24 24">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4"
                                ></path>
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853"
                                ></path>
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                    fill="#FBBC05"
                                ></path>
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335"
                                ></path>
                            </svg>
                            Continue with Google
                        </button>
                        <!-- Separator -->
                        <div class="relative flex items-center">
                            <div
                                class="flex-grow border-t border-outline-variant/15"
                            ></div>
                            <span
                                class="flex-shrink mx-4 text-[10px] font-bold text-outline uppercase tracking-[0.2em]"
                                >OR USE EMAIL</span
                            >
                            <div
                                class="flex-grow border-t border-outline-variant/15"
                            ></div>
                        </div>
                        <!-- Input Fields -->
                        <form class="space-y-4">
                            <div class="space-y-1.5">
                                <label
                                    class="text-xs font-bold text-on-surface-variant uppercase tracking-wider ml-1"
                                    >Full Name</label
                                >
                                <input
                                    class="w-full bg-surface-container-highest border-none rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-outline/60 font-medium"
                                    placeholder="Julianne Smith"
                                    type="text"
                                />
                            </div>
                            <div class="space-y-1.5">
                                <label
                                    class="text-xs font-bold text-on-surface-variant uppercase tracking-wider ml-1"
                                    >Email Address</label
                                >
                                <input
                                    class="w-full bg-surface-container-highest border-none rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-outline/60 font-medium"
                                    placeholder="julianne@editorial.com"
                                    type="email"
                                />
                            </div>
                            <div class="space-y-1.5">
                                <label
                                    class="text-xs font-bold text-on-surface-variant uppercase tracking-wider ml-1"
                                    >Password</label
                                >
                                <div class="relative group">
                                    <input
                                        class="w-full bg-surface-container-highest border-none rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/20 transition-all text-on-surface placeholder:text-outline/60 font-medium"
                                        placeholder="••••••••"
                                        type="password"
                                    />
                                    <button
                                        class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors"
                                        type="button"
                                    >
                                        <span
                                            class="material-symbols-outlined text-[20px]"
                                            data-icon="visibility"
                                            >visibility</span
                                        >
                                    </button>
                                </div>
                            </div>
                            <!-- Terms Checkbox -->
                            <div class="flex items-start gap-3 pt-2">
                                <input
                                    class="mt-1 rounded border-outline-variant text-primary focus:ring-primary transition-all bg-surface-container-low"
                                    id="terms"
                                    type="checkbox"
                                />
                                <label
                                    class="text-sm text-on-surface-variant leading-relaxed"
                                    for="terms"
                                >
                                    I agree to the
                                    <a
                                        class="text-primary font-semibold hover:underline"
                                        href="#"
                                        >Terms of Service</a
                                    >
                                    and
                                    <a
                                        class="text-primary font-semibold hover:underline"
                                        href="#"
                                        >Privacy Policy</a
                                    >
                                </label>
                            </div>
                            <!-- CTA Button -->
                            <button
                                class="w-full signature-gradient text-white font-bold py-4 px-6 rounded-full mt-6 shadow-[0_8px_30px_rgb(13,99,27,0.15)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                                type="submit"
                            >
                                Create Account
                                <span
                                    class="material-symbols-outlined text-[18px]"
                                    data-icon="arrow_forward"
                                    >arrow_forward</span
                                >
                            </button>
                        </form>
                        <!-- Sign In Link -->
                        <p
                            class="text-center text-on-surface-variant font-medium"
                        >
                            Already have an account?
                            <a
                                class="text-primary font-bold hover:underline transition-all"
                                href="#"
                                >Sign In</a
                            >
                        </p>
                    </div>
                    <!-- Footer Links -->
                    <footer class="pt-8 border-t border-outline-variant/10">
                        <div
                            class="flex flex-wrap justify-between items-center gap-4"
                        >
                            <span
                                class="text-xs font-bold text-outline/50 tracking-widest uppercase"
                                >v2.4.1 Edition</span
                            >
                            <nav class="flex gap-4">
                                <a
                                    class="text-xs font-bold text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest"
                                    href="#"
                                    >Privacy</a
                                >
                                <a
                                    class="text-xs font-bold text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest"
                                    href="#"
                                    >Terms</a
                                >
                                <a
                                    class="text-xs font-bold text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest"
                                    href="#"
                                    >Support</a
                                >
                            </nav>
                        </div>
                    </footer>
                </div>
            </section>
        </main>
    </body>
</html>
