<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Sign Up - Zubora Kitchen</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            tertiary: "#895024",
                            "on-secondary-fixed": "#301400",
                            "error-container": "#ffdad6",
                            "on-error-container": "#93000a",
                            "on-primary-fixed-variant": "#005227",
                            "on-tertiary-fixed-variant": "#6c3a0f",
                            "on-tertiary": "#ffffff",
                            "on-tertiary-fixed": "#301400",
                            "primary-container": "#4ade80",
                            "surface-container-high": "#e2ebe0",
                            "tertiary-fixed": "#ffdcc6",
                            outline: "#6d7b6d",
                            "inverse-surface": "#2b322b",
                            "on-error": "#ffffff",
                            "on-primary-container": "#005e2d",
                            "on-secondary-container": "#693300",
                            "surface-dim": "#d4dcd2",
                            "on-surface": "#161d17",
                            "surface-container-low": "#eef6eb",
                            "on-primary": "#ffffff",
                            "on-secondary": "#ffffff",
                            error: "#ba1a1a",
                            "on-background": "#161d17",
                            "inverse-on-surface": "#ebf3e8",
                            "surface-container-lowest": "#ffffff",
                            "surface-bright": "#f3fcf0",
                            secondary: "#944a00",
                            "on-tertiary-container": "#794418",
                            "primary-fixed-dim": "#4de082",
                            "surface-tint": "#006d36",
                            "secondary-fixed": "#ffdcc5",
                            "surface-container-highest": "#dde5da",
                            "tertiary-container": "#ffb47f",
                            "surface-container": "#e8f0e5",
                            "primary-fixed": "#6dfe9c",
                            "surface-variant": "#dde5da",
                            background: "#f3fcf0",
                            "tertiary-fixed-dim": "#ffb784",
                            "secondary-container": "#fd933d",
                            "secondary-fixed-dim": "#ffb783",
                            surface: "#f3fcf0",
                            "inverse-primary": "#4de082",
                            "on-secondary-fixed-variant": "#713700",
                            "outline-variant": "#bccabb",
                            "on-primary-fixed": "#00210c",
                            "on-surface-variant": "#3d4a3e",
                            primary: "#006d36",
                        },
                        borderRadius: {
                            DEFAULT: "0.25rem",
                            lg: "0.5rem",
                            xl: "0.75rem",
                            full: "9999px",
                        },
                        spacing: {
                            md: "16px",
                            base: "4px",
                            "margin-mobile": "20px",
                            "margin-desktop": "64px",
                            xs: "4px",
                            sm: "8px",
                            gutter: "16px",
                            xl: "32px",
                            lg: "24px",
                            "max-width": "1200px",
                        },
                        fontFamily: {
                            "body-lg": ["Be Vietnam Pro"],
                            "headline-md": ["Plus Jakarta Sans"],
                            "display-lg": ["Plus Jakarta Sans"],
                            "headline-lg": ["Plus Jakarta Sans"],
                            "body-md": ["Be Vietnam Pro"],
                            "label-md": ["Be Vietnam Pro"],
                            "headline-lg-mobile": ["Plus Jakarta Sans"],
                            "label-sm": ["Be Vietnam Pro"],
                        },
                        fontSize: {
                            "body-lg": [
                                "18px",
                                {
                                    lineHeight: "28px",
                                    fontWeight: "400",
                                },
                            ],
                            "headline-md": [
                                "24px",
                                {
                                    lineHeight: "32px",
                                    fontWeight: "600",
                                },
                            ],
                            "display-lg": [
                                "40px",
                                {
                                    lineHeight: "48px",
                                    letterSpacing: "-0.02em",
                                    fontWeight: "700",
                                },
                            ],
                            "headline-lg": [
                                "32px",
                                {
                                    lineHeight: "40px",
                                    letterSpacing: "-0.01em",
                                    fontWeight: "600",
                                },
                            ],
                            "body-md": [
                                "16px",
                                {
                                    lineHeight: "24px",
                                    fontWeight: "400",
                                },
                            ],
                            "label-md": [
                                "14px",
                                {
                                    lineHeight: "20px",
                                    letterSpacing: "0.05em",
                                    fontWeight: "600",
                                },
                            ],
                            "headline-lg-mobile": [
                                "28px",
                                {
                                    lineHeight: "34px",
                                    fontWeight: "600",
                                },
                            ],
                            "label-sm": [
                                "12px",
                                {
                                    lineHeight: "16px",
                                    fontWeight: "500",
                                },
                            ],
                        },
                    },
                },
            };
        </script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
            .shadow-soft {
                box-shadow: 0 4px 12px rgba(109, 123, 109, 0.04);
            }
            .inset-shadow-soft {
                box-shadow: inset 0 2px 4px rgba(109, 123, 109, 0.05);
            }
        </style>
    </head>
    <body
        class="bg-surface-bright text-on-surface min-h-screen flex items-center justify-center font-body-md antialiased p-margin-mobile md:p-margin-desktop relative overflow-hidden"
    >
        <!-- Decorative background elements -->
        <div
            class="absolute top-[-10%] left-[-5%] w-96 h-96 bg-primary-container/20 rounded-full blur-[100px] pointer-events-none"
        ></div>
        <div
            class="absolute bottom-[-10%] right-[-5%] w-[500px] h-[500px] bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"
        ></div>
        <main class="w-full max-w-md relative z-10">
            <div
                class="bg-surface-container-lowest rounded-[24px] shadow-soft border border-outline-variant/30 p-lg md:p-xl flex flex-col gap-lg"
            >
                <!-- Header Section -->
                <div class="text-center flex flex-col items-center gap-sm">
                    <div
                        class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-sm shadow-soft"
                    >
                        <span
                            class="material-symbols-outlined text-on-primary-container text-[32px]"
                            style="font-variation-settings: &quot;FILL&quot; 1"
                            >restaurant_menu</span
                        >
                    </div>
                    <h1
                        class="font-headline-lg text-headline-lg text-on-surface"
                    >
                        Zubora Kitchen
                    </h1>
                    <p
                        class="font-body-md text-body-md text-on-surface-variant"
                    >
                        Create your account to start organizing your culinary
                        life.
                    </p>
                </div>
                <!-- Form Section -->
                <form class="flex flex-col gap-md">
                    <!-- Name Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface"
                            for="name"
                            >User Name</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >person</span
                            >
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="name"
                                name="name"
                                placeholder="Alex Chef"
                                required=""
                                type="text"
                            />
                        </div>
                    </div>
                    <!-- Email Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface"
                            for="email"
                            >Email Address</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >mail</span
                            >
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="email"
                                name="email"
                                placeholder="alex@example.com"
                                required=""
                                type="email"
                            />
                        </div>
                    </div>
                    <!-- Password Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface"
                            for="password"
                            >Password</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >lock</span
                            >
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required=""
                                type="password"
                            />
                        </div>
                    </div>
                    <!-- Password Confirmation Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface"
                            for="password_confirmation"
                            >Confirm Password</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >CloudCheck</span
                            >
                            <input
                                class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="password_confirmation"
                                name="password_confirmation"
                                placeholder="••••••••"
                                required=""
                                type="password"
                            />
                        </div>
                    </div>
                    <!-- Action Button -->
                    <button
                        class="w-full bg-primary text-on-primary font-label-md text-label-md py-[14px] px-lg rounded-xl mt-sm hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-soft"
                        type="submit"
                    >
                        Create Account
                        <span class="material-symbols-outlined text-[20px]"
                            >arrow_forward</span
                        >
                    </button>
                </form>
                <!-- Footer Links -->
                <div class="text-center mt-xs">
                    <p
                        class="font-body-md text-body-md text-on-surface-variant"
                    >
                        Already have an account?
                        <a
                            class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors ml-xs"
                            href="#"
                            >Log in here</a
                        >
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
