<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Edit Profile - Zubora Kitchen</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link
            crossorigin=""
            href="https://fonts.gstatic.com"
            rel="preconnect"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "on-secondary-fixed-variant": "#713700",
                            "on-background": "#161d17",
                            "surface-container": "#e8f0e5",
                            "on-tertiary-container": "#794418",
                            "surface-variant": "#dde5da",
                            "on-surface": "#161d17",
                            error: "#ba1a1a",
                            "tertiary-fixed": "#ffdcc6",
                            "surface-bright": "#f3fcf0",
                            "secondary-container": "#fd933d",
                            "inverse-on-surface": "#ebf3e8",
                            "surface-container-low": "#eef6eb",
                            "inverse-primary": "#4de082",
                            "outline-variant": "#bccabb",
                            "on-primary": "#ffffff",
                            outline: "#6d7b6d",
                            "on-secondary-fixed": "#301400",
                            "on-tertiary-fixed-variant": "#6c3a0f",
                            "tertiary-fixed-dim": "#ffb784",
                            "on-surface-variant": "#3d4a3e",
                            "on-tertiary": "#ffffff",
                            "on-secondary": "#ffffff",
                            secondary: "#944a00",
                            "on-tertiary-fixed": "#301400",
                            "on-secondary-container": "#693300",
                            "on-error-container": "#93000a",
                            tertiary: "#895024",
                            "primary-container": "#4ade80",
                            "surface-tint": "#006d36",
                            "surface-container-highest": "#dde5da",
                            primary: "#006d36",
                            "primary-fixed-dim": "#4de082",
                            "surface-container-lowest": "#ffffff",
                            "on-primary-fixed-variant": "#005227",
                            "primary-fixed": "#6dfe9c",
                            surface: "#f3fcf0",
                            "on-primary-container": "#005e2d",
                            "tertiary-container": "#ffb47f",
                            "secondary-fixed-dim": "#ffb783",
                            "error-container": "#ffdad6",
                            "surface-dim": "#d4dcd2",
                            "surface-container-high": "#e2ebe0",
                            "on-primary-fixed": "#00210c",
                            "secondary-fixed": "#ffdcc5",
                            "inverse-surface": "#2b322b",
                            background: "#f3fcf0",
                            "on-error": "#ffffff",
                        },
                        borderRadius: {
                            DEFAULT: "0.25rem",
                            lg: "0.5rem",
                            xl: "0.75rem",
                            full: "9999px",
                        },
                        spacing: {
                            sm: "8px",
                            lg: "24px",
                            base: "4px",
                            xs: "4px",
                            xl: "32px",
                            md: "16px",
                            "margin-desktop": "64px",
                            gutter: "16px",
                            "margin-mobile": "20px",
                            "max-width": "1200px",
                        },
                        fontFamily: {
                            "headline-lg-mobile": ["Plus Jakarta Sans"],
                            "label-sm": ["Be Vietnam Pro"],
                            "label-md": ["Be Vietnam Pro"],
                            "display-lg": ["Plus Jakarta Sans"],
                            "headline-md": ["Plus Jakarta Sans"],
                            "headline-lg": ["Plus Jakarta Sans"],
                            "body-md": ["Be Vietnam Pro"],
                            "body-lg": ["Be Vietnam Pro"],
                        },
                        fontSize: {
                            "headline-lg-mobile": [
                                "28px",
                                {
                                    lineHeight: "34px",
                                    fontWeight: "600",
                                },
                            ],
                            "label-sm": [
                                "12px",
                                {
                                    lineHeight: "16px",
                                    fontWeight: "500",
                                },
                            ],
                            "label-md": [
                                "14px",
                                {
                                    lineHeight: "20px",
                                    letterSpacing: "0.05em",
                                    fontWeight: "600",
                                },
                            ],
                            "display-lg": [
                                "40px",
                                {
                                    lineHeight: "48px",
                                    letterSpacing: "-0.02em",
                                    fontWeight: "700",
                                },
                            ],
                            "headline-md": [
                                "24px",
                                {
                                    lineHeight: "32px",
                                    fontWeight: "600",
                                },
                            ],
                            "headline-lg": [
                                "32px",
                                {
                                    lineHeight: "40px",
                                    letterSpacing: "-0.01em",
                                    fontWeight: "600",
                                },
                            ],
                            "body-md": [
                                "16px",
                                {
                                    lineHeight: "24px",
                                    fontWeight: "400",
                                },
                            ],
                            "body-lg": [
                                "18px",
                                {
                                    lineHeight: "28px",
                                    fontWeight: "400",
                                },
                            ],
                        },
                    },
                },
            };
        </script>
    </head>
    <body
        class="bg-background text-on-background font-body-md text-body-md antialiased h-screen flex overflow-hidden"
    >
        <!-- SideNavBar -->
        <nav
            class="hidden md:flex flex-col gap-lg p-lg fixed left-0 top-0 h-full z-50 overflow-y-auto bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed-dim border-r border-outline-variant dark:border-outline shadow-sm dark:shadow-none w-64 md:w-72"
        >
            <div class="flex items-center gap-md px-4 py-2">
                <span
                    class="material-symbols-outlined text-[32px] text-primary"
                    data-icon="restaurant"
                    >restaurant</span
                >
                <div>
                    <h1
                        class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim font-bold"
                    >
                        Zubora Kitchen
                    </h1>
                    <p
                        class="font-label-sm text-label-sm text-on-surface-variant"
                    >
                        Your AI Sous Chef
                    </p>
                </div>
            </div>
            <button
                class="flex items-center justify-center gap-sm bg-primary-container text-on-primary-container hover:bg-primary hover:text-on-primary transition-colors rounded-xl py-3 px-4 font-label-md text-label-md mt-sm"
            >
                <span class="material-symbols-outlined" data-icon="add"
                    >add</span
                >
                Add Ingredients
            </button>
            <div class="flex flex-col gap-sm mt-md flex-1">
                <!-- Inactive -->
                <a
                    class="flex items-center gap-md text-on-surface-variant dark:text-on-surface-variant rounded-xl px-4 py-3 font-medium hover:bg-surface-container dark:hover:bg-surface-container-highest hover:text-primary dark:hover:text-primary-fixed-dim transition-all"
                    href="#"
                >
                    <span class="material-symbols-outlined" data-icon="home"
                        >home</span
                    >
                    <span class="font-label-md text-label-md">Home</span>
                </a>
                <!-- Inactive -->
                <a
                    class="flex items-center gap-md text-on-surface-variant dark:text-on-surface-variant rounded-xl px-4 py-3 font-medium hover:bg-surface-container dark:hover:bg-surface-container-highest hover:text-primary dark:hover:text-primary-fixed-dim transition-all"
                    href="#"
                >
                    <span
                        class="material-symbols-outlined"
                        data-icon="inventory_2"
                        >inventory_2</span
                    >
                    <span class="font-label-md text-label-md"
                        >Food Inventory</span
                    >
                </a>
                <!-- Inactive -->
                <a
                    class="flex items-center gap-md text-on-surface-variant dark:text-on-surface-variant rounded-xl px-4 py-3 font-medium hover:bg-surface-container dark:hover:bg-surface-container-highest hover:text-primary dark:hover:text-primary-fixed-dim transition-all"
                    href="#"
                >
                    <span
                        class="material-symbols-outlined"
                        data-icon="restaurant_menu"
                        >restaurant_menu</span
                    >
                    <span class="font-label-md text-label-md">Recipe List</span>
                </a>
                <!-- Active -->
                <a
                    class="flex items-center gap-md bg-primary-container/20 text-on-primary-container dark:bg-primary-fixed-dim/10 dark:text-primary-fixed-dim rounded-xl px-4 py-3 font-bold hover:bg-surface-container dark:hover:bg-surface-container-highest hover:text-primary dark:hover:text-primary-fixed-dim transition-all scale-[0.98]"
                    href="#"
                >
                    <span
                        class="material-symbols-outlined"
                        data-icon="settings"
                        data-weight="fill"
                        style="font-variation-settings: &quot;FILL&quot; 1"
                        >settings</span
                    >
                    <span class="font-label-md text-label-md">Settings</span>
                </a>
            </div>
        </nav>
        <!-- Main Content -->
        <main
            class="flex-1 ml-0 md:ml-72 flex flex-col h-full overflow-y-auto bg-surface-bright"
        >
            <!-- TopAppBar (Mobile Fallback for Structure, hidden on desktop if following strict sidenav paradigm, but kept for responsive layout padding) -->
            <header
                class="md:hidden bg-surface/80 backdrop-blur-md dark:bg-surface-dim/80 text-primary dark:text-primary-fixed-dim flex items-center justify-between px-margin-mobile py-md w-full z-40 sticky top-0"
            >
                <h1
                    class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim font-bold tracking-tight"
                >
                    Zubora Kitchen
                </h1>
                <button
                    class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full"
                >
                    <span
                        class="material-symbols-outlined"
                        data-icon="account_circle"
                        >account_circle</span
                    >
                </button>
            </header>
            <div
                class="flex-1 max-w-[max-width] w-full mx-auto px-margin-mobile md:px-margin-desktop py-lg md:py-xl flex flex-col gap-lg"
            >
                <!-- Breadcrumb / Back Navigation -->
                <div class="flex items-center gap-2 mb-md">
                    <a
                        class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors"
                        href="#"
                    >
                        <span
                            class="material-symbols-outlined text-sm"
                            data-icon="arrow_back"
                            >arrow_back</span
                        >
                        <span class="font-label-md text-label-md"
                            >Settings</span
                        >
                    </a>
                    <span class="text-on-surface-variant text-sm">/</span>
                    <span class="font-label-md text-label-md text-primary"
                        >Edit Profile</span
                    >
                </div>
                <!-- Form Container Card -->
                <div
                    class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.04)] border border-surface-variant p-lg md:p-xl flex flex-col gap-xl max-w-2xl"
                >
                    <div
                        class="flex flex-col gap-sm border-b border-surface-variant pb-md"
                    >
                        <h2
                            class="font-headline-lg text-headline-lg text-on-background"
                        >
                            Edit Profile
                        </h2>
                        <p
                            class="font-body-md text-body-md text-on-surface-variant"
                        >
                            Update your personal information and profile
                            picture.
                        </p>
                    </div>
                    <!-- Profile Picture Section -->
                    <!-- Form Fields -->
                    <form class="flex flex-col gap-lg">
                        <div class="flex flex-col gap-sm">
                            <label
                                class="font-label-md text-label-md text-on-surface-variant"
                                for="name"
                                >Full Name</label
                            >
                            <div class="relative">
                                <span
                                    class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant"
                                    data-icon="person"
                                    >person</span
                                >
                                <input
                                    class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-background focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your full name"
                                    type="text"
                                    value="Alex Mercer"
                                />
                            </div>
                        </div>
                        <div class="flex flex-col gap-sm">
                            <label
                                class="font-label-md text-label-md text-on-surface-variant"
                                for="email"
                                >Email Address</label
                            >
                            <div class="relative">
                                <span
                                    class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant"
                                    data-icon="mail"
                                    >mail</span
                                >
                                <input
                                    class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-background focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email address"
                                    type="email"
                                    value="alex.mercer@example.com"
                                />
                            </div>
                        </div>
                        <!-- Dietary Preferences (Bento-style chips to break up standard list) -->
                        <div
                            class="flex flex-col gap-sm pt-md border-t border-surface-variant"
                        >
                            <label
                                class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between"
                            >
                                Dietary Preferences
                                <button
                                    class="text-primary hover:underline font-label-sm text-label-sm flex items-center gap-1"
                                    type="button"
                                >
                                    <span
                                        class="material-symbols-outlined text-[16px]"
                                        data-icon="add_circle"
                                        >add_circle</span
                                    >
                                    Add
                                </button>
                            </label>
                            <div class="flex flex-wrap gap-sm">
                                <span
                                    class="inline-flex items-center gap-1 bg-surface-container px-3 py-1.5 rounded-lg border border-outline-variant/50 font-label-sm text-label-sm text-on-surface"
                                >
                                    Vegetarian
                                    <button
                                        class="hover:text-error transition-colors"
                                        type="button"
                                    >
                                        <span
                                            class="material-symbols-outlined text-[14px]"
                                            data-icon="close"
                                            >close</span
                                        >
                                    </button>
                                </span>
                                <span
                                    class="inline-flex items-center gap-1 bg-surface-container px-3 py-1.5 rounded-lg border border-outline-variant/50 font-label-sm text-label-sm text-on-surface"
                                >
                                    Gluten-Free
                                    <button
                                        class="hover:text-error transition-colors"
                                        type="button"
                                    >
                                        <span
                                            class="material-symbols-outlined text-[14px]"
                                            data-icon="close"
                                            >close</span
                                        >
                                    </button>
                                </span>
                            </div>
                        </div>
                        <!-- Action Buttons -->
                        <div
                            class="flex items-center justify-end gap-md pt-lg mt-md border-t border-surface-variant"
                        >
                            <button
                                class="px-6 py-2.5 rounded-xl border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-low transition-colors"
                                type="button"
                            >
                                Cancel
                            </button>
                            <button
                                class="px-6 py-2.5 rounded-xl border border-primary text-primary font-label-md text-label-md hover:bg-primary/5 transition-colors"
                                type="button"
                            >
                                パスワードを変更</button
                            ><button
                                class="px-6 py-2.5 rounded-xl bg-primary-container text-on-primary-container font-label-md text-label-md hover:bg-primary hover:text-on-primary transition-colors shadow-sm"
                                type="button"
                            >
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
