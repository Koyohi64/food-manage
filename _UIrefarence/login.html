<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Login | The Culinary Editorial</title>
        <!-- Font Imports -->
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link
            crossorigin=""
            href="https://fonts.gstatic.com"
            rel="preconnect"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <!-- Icon Imports -->
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            background: "#f9f9f8",
                            "inverse-surface": "#2e3131",
                            "surface-variant": "#e1e3e2",
                            tertiary: "#ac0c18",
                            "tertiary-container": "#d02d2d",
                            primary: "#0d631b",
                            "inverse-on-surface": "#f0f1f0",
                            "on-surface": "#191c1c",
                            "surface-container-highest": "#e1e3e2",
                            "on-secondary": "#ffffff",
                            "tertiary-fixed": "#ffdad6",
                            "primary-container": "#2e7d32",
                            "primary-fixed": "#a3f69c",
                            "on-secondary-fixed": "#311300",
                            "on-primary": "#ffffff",
                            "surface-container": "#edeeed",
                            surface: "#f9f9f8",
                            "surface-tint": "#1b6d24",
                            "surface-container-high": "#e7e8e7",
                            "primary-fixed-dim": "#88d982",
                            "on-tertiary-container": "#ffedeb",
                            "on-primary-fixed-variant": "#005312",
                            "on-secondary-container": "#5e2c00",
                            "surface-dim": "#d9dad9",
                            "on-secondary-fixed-variant": "#723600",
                            "on-error": "#ffffff",
                            "on-tertiary": "#ffffff",
                            "on-tertiary-fixed": "#410003",
                            error: "#ba1a1a",
                            "secondary-fixed-dim": "#ffb786",
                            "on-surface-variant": "#40493d",
                            "surface-container-low": "#f3f4f3",
                            outline: "#707a6c",
                            "surface-container-lowest": "#ffffff",
                            "outline-variant": "#bfcaba",
                            "on-primary-fixed": "#002204",
                            "error-container": "#ffdad6",
                            "tertiary-fixed-dim": "#ffb3ac",
                            "on-primary-container": "#cbffc2",
                            "secondary-container": "#fc820c",
                            "inverse-primary": "#88d982",
                            "secondary-fixed": "#ffdcc6",
                            secondary: "#964900",
                            "surface-bright": "#f9f9f8",
                            "on-tertiary-fixed-variant": "#930010",
                            "on-error-container": "#93000a",
                            "on-background": "#191c1c",
                        },
                        borderRadius: {
                            DEFAULT: "0.25rem",
                            lg: "0.5rem",
                            xl: "1.5rem",
                            full: "9999px",
                        },
                        fontFamily: {
                            headline: ["Plus Jakarta Sans"],
                            display: ["Plus Jakarta Sans"],
                            body: ["Be Vietnam Pro"],
                            label: ["Be Vietnam Pro"],
                        },
                    },
                },
            };
        </script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
            body {
                font-family: "Be Vietnam Pro", sans-serif;
            }
            h1,
            h2,
            h3 {
                font-family: "Plus Jakarta Sans", sans-serif;
            }
            /* Glass effect for the login card on mobile */
            .editorial-glass {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(24px);
            }
        </style>
    </head>
    <body
        class="bg-background text-on-surface min-h-screen flex overflow-hidden"
    >
        <!-- Left Side: Editorial Image Canvas -->
        <section
            class="hidden lg:flex lg:w-1/2 xl:w-3/5 relative overflow-hidden bg-surface-container"
        >
            <img
                class="absolute inset-0 w-full h-full object-cover"
                data-alt="Artistic close-up of a rustic wooden pantry shelf with glass jars filled with colorful grains, dried herbs, and artisanal olive oil in soft natural morning light"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9iPFeBFv32YPj1jdlAzY1XKjA5PH1Fwso5JJFMgqtbw6YQwcS08S4kJC3Hz-zfiUkBazBVP_T9pZLebave1sODHTZ87KYM5nMKa1oiLNJs6XhIFxbtJ3ljFjJZET8z8apjHRY8Y4wZJv1BJNbSoO8TC-k6gJg7Xb2dmyfVcyaOHzAO5qf-Sz0DEYHzemz9TlBQkblXvRRmCuC09n6ErtzILCz2_YUZy5aHyND4dDwf65TQthHCI5CEliBMupEy3kNVFc6jZznzsro"
            />
            <!-- Branding Overlay -->
            <div class="absolute top-12 left-12 z-10">
                <h1
                    class="text-4xl font-extrabold tracking-tighter text-on-primary-container drop-shadow-sm"
                >
                    The Culinary Editorial
                </h1>
                <p
                    class="mt-2 text-on-primary-container/80 max-w-xs font-medium leading-relaxed"
                >
                    Curating your kitchen experience with editorial precision.
                </p>
            </div>
            <!-- Decorative Bottom Element -->
            <div
                class="absolute bottom-12 left-12 z-10 flex items-center space-x-4"
            >
                <div class="w-12 h-[1px] bg-on-primary-container/40"></div>
                <span
                    class="text-sm uppercase tracking-[0.2em] font-semibold text-on-primary-container/60"
                    >Issue No. 04: The Verdant Hearth</span
                >
            </div>
        </section>
        <!-- Right Side: Interaction Canvas -->
        <main
            class="w-full lg:w-1/2 xl:w-2/5 flex flex-col justify-center items-center px-6 md:px-16 bg-background relative"
        >
            <!-- Mobile Background (Only visible on small screens) -->
            <div class="lg:hidden absolute inset-0 z-0">
                <img
                    class="w-full h-full object-cover opacity-20"
                    data-alt="Soft focused background of organic kitchen ingredients and glass storage jars"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAalH2Jgnh11rnC0E8fNw8qaa3k0KoS4jivBaisb8y2r7N6PuiXwtQn2NjVrYdUyAK_EGLRDf2jqVm3tLMtV6XtBHVs0gnFOITqkg7xWgRHx7nJsnCLm3swPZZWzBTONI9zRO_1_k2PMhxJ5nq4FuJ_HRwVZiQnjnMMZ-3Rz4XJWVZ5W4GiuxUCivq994kze71_-Rg7-LFsFKb6wB2Gyej8H3ayk9rCx5zFODZCHzHfj-LFUb-gX6uZLUrpbRX3KfytryDzEL10e375"
                />
            </div>
            <div class="w-full max-w-md z-10">
                <!-- Form Header -->
                <header class="mb-10 lg:text-left text-center">
                    <h2
                        class="text-3xl font-extrabold text-on-surface mb-3 tracking-tight"
                    >
                        Welcome Back
                    </h2>
                    <p class="text-on-surface-variant font-medium">
                        Access your curated pantry and seasonal recipes.
                    </p>
                </header>
                <!-- Social Login -->
                <div class="space-y-4 mb-8">
                    <button
                        class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest text-on-surface-variant font-semibold py-4 px-6 rounded-xl border border-outline-variant/15 hover:bg-surface-bright transition-all active:scale-[0.98]"
                    >
                        <svg class="w-5 h-5" viewbox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"
                            ></path>
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"
                            ></path>
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                fill="#FBBC05"
                            ></path>
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335"
                            ></path>
                        </svg>
                        Continue with Google
                    </button>
                </div>
                <!-- Divider -->
                <div class="flex items-center gap-4 mb-8">
                    <div class="h-[1px] flex-grow bg-outline-variant/30"></div>
                    <span
                        class="text-xs uppercase tracking-widest text-on-surface-variant font-bold"
                        >or use email</span
                    >
                    <div class="h-[1px] flex-grow bg-outline-variant/30"></div>
                </div>
                <!-- Login Form -->
                <form class="space-y-6">
                    <!-- Email Field -->
                    <div class="space-y-2">
                        <label
                            class="block text-sm font-bold text-on-surface ml-1"
                            for="email"
                            >Email Address</label
                        >
                        <input
                            class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 transition-all outline-none"
                            id="email"
                            placeholder="e.g., curator@editorial.com"
                            type="email"
                        />
                    </div>
                    <!-- Password Field -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center px-1">
                            <label
                                class="block text-sm font-bold text-on-surface"
                                for="password"
                                >Password</label
                            >
                            <a
                                class="text-xs font-semibold text-primary hover:text-primary-container transition-colors"
                                href="#"
                                >Forgot Password?</a
                            >
                        </div>
                        <div class="relative">
                            <input
                                class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 transition-all outline-none"
                                id="password"
                                placeholder="••••••••"
                                type="password"
                            />
                            <button
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors"
                                type="button"
                            >
                                <span
                                    class="material-symbols-outlined text-xl"
                                    data-icon="visibility"
                                    >visibility</span
                                >
                            </button>
                        </div>
                    </div>
                    <!-- Remember Me (Editorial Detail) -->
                    <div class="flex items-center px-1">
                        <input
                            class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all"
                            id="remember"
                            type="checkbox"
                        />
                        <label
                            class="ml-3 text-sm font-medium text-on-surface-variant select-none"
                            for="remember"
                            >Keep me signed in for 30 days</label
                        >
                    </div>
                    <!-- Sign In Button -->
                    <div class="pt-2">
                        <button
                            class="w-full py-4 px-6 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg shadow-[0_32px_32px_-4px_rgba(13,99,27,0.1)] hover:shadow-[0_32px_48px_-4px_rgba(13,99,27,0.15)] active:scale-[0.98] transition-all relative overflow-hidden group"
                            type="submit"
                        >
                            <span class="relative z-10">Sign In</span>
                            <div
                                class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"
                            ></div>
                        </button>
                    </div>
                </form>
                <!-- Footer Links -->
                <footer class="mt-12 text-center lg:text-left">
                    <p class="text-on-surface-variant font-medium">
                        Don't have an account?
                        <a
                            class="text-primary font-bold ml-1 hover:underline decoration-primary-fixed decoration-2 underline-offset-4"
                            href="#"
                            >Sign Up</a
                        >
                    </p>
                </footer>
            </div>
            <!-- Decorative Top-Level Legal -->
            <div
                class="absolute bottom-8 left-0 right-0 px-6 flex justify-between text-[10px] uppercase tracking-widest text-on-surface-variant/40 font-bold"
            >
                <span class="hidden md:block"
                    >The Culinary Editorial © 2024</span
                >
                <div
                    class="flex gap-6 w-full justify-center md:w-auto md:justify-end"
                >
                    <a class="hover:text-primary transition-colors" href="#"
                        >Privacy</a
                    >
                    <a class="hover:text-primary transition-colors" href="#"
                        >Terms</a
                    >
                    <a class="hover:text-primary transition-colors" href="#"
                        >Support</a
                    >
                </div>
            </div>
        </main>
    </body>
</html>
