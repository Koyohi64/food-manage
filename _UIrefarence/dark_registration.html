<!doctype html>

<html class="dark" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Sign Up - Zubora Kitchen</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
            rel="stylesheet"
        />
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "on-secondary-container": "#004d44",
                            "on-primary-fixed-variant": "#005227",
                            "surface-variant": "#2f372f",
                            "on-surface": "#dde5da",
                            "on-primary": "#003919",
                            "surface-container-high": "#242c25",
                            "primary-fixed-dim": "#4de082",
                            "surface-tint": "#4de082",
                            "on-tertiary-container": "#794418",
                            error: "#ffb4ab",
                            "on-error-container": "#ffdad6",
                            "surface-bright": "#333b34",
                            "surface-container-highest": "#2f372f",
                            "on-error": "#690005",
                            "on-secondary": "#003731",
                            "on-secondary-fixed": "#00201c",
                            "tertiary-fixed": "#ffdcc6",
                            "surface-dim": "#0e150f",
                            "secondary-container": "#03c6b2",
                            "inverse-surface": "#dde5da",
                            "surface-container-low": "#161d17",
                            "error-container": "#93000a",
                            "on-primary-fixed": "#00210c",
                            background: "#0e150f",
                            "surface-container": "#1a211b",
                            "on-tertiary-fixed": "#301400",
                            "primary-container": "#4ade80",
                            "outline-variant": "#3d4a3e",
                            surface: "#0e150f",
                            "inverse-on-surface": "#2b322b",
                            "on-tertiary": "#4f2500",
                            "on-secondary-fixed-variant": "#005047",
                            "on-surface-variant": "#bccabb",
                            secondary: "#44e2cd",
                            outline: "#869486",
                            "on-tertiary-fixed-variant": "#6c3a0f",
                            "secondary-fixed": "#62fae3",
                            "on-primary-container": "#005e2d",
                            primary: "#6bfb9a",
                            "tertiary-fixed-dim": "#ffb784",
                            "secondary-fixed-dim": "#3cddc7",
                            "on-background": "#dde5da",
                            tertiary: "#ffd9c1",
                            "inverse-primary": "#006d36",
                            "primary-fixed": "#6dfe9c",
                            "surface-container-lowest": "#09100a",
                            "tertiary-container": "#ffb47f",
                        },
                        borderRadius: {
                            DEFAULT: "0.25rem",
                            lg: "0.5rem",
                            xl: "0.75rem",
                            full: "9999px",
                        },
                        spacing: {
                            gutter: "20px",
                            "margin-mobile": "16px",
                            "margin-desktop": "64px",
                            lg: "24px",
                            xl: "32px",
                            md: "16px",
                            xs: "4px",
                            unit: "4px",
                            sm: "8px",
                        },
                        fontFamily: {
                            "headline-md": ["Plus Jakarta Sans"],
                            "display-lg": ["Plus Jakarta Sans"],
                            "body-md": ["Plus Jakarta Sans"],
                            "body-lg": ["Plus Jakarta Sans"],
                            "headline-lg-mobile": ["Plus Jakarta Sans"],
                            "label-md": ["Plus Jakarta Sans"],
                            "label-sm": ["Plus Jakarta Sans"],
                            "headline-lg": ["Plus Jakarta Sans"],
                        },
                        fontSize: {
                            "headline-md": [
                                "24px",
                                { lineHeight: "32px", fontWeight: "600" },
                            ],
                            "display-lg": [
                                "48px",
                                {
                                    lineHeight: "56px",
                                    letterSpacing: "-0.02em",
                                    fontWeight: "800",
                                },
                            ],
                            "body-md": [
                                "16px",
                                { lineHeight: "24px", fontWeight: "400" },
                            ],
                            "body-lg": [
                                "18px",
                                { lineHeight: "28px", fontWeight: "400" },
                            ],
                            "headline-lg-mobile": [
                                "28px",
                                { lineHeight: "36px", fontWeight: "700" },
                            ],
                            "label-md": [
                                "14px",
                                {
                                    lineHeight: "20px",
                                    letterSpacing: "0.01em",
                                    fontWeight: "600",
                                },
                            ],
                            "label-sm": [
                                "12px",
                                { lineHeight: "16px", fontWeight: "500" },
                            ],
                            "headline-lg": [
                                "32px",
                                {
                                    lineHeight: "40px",
                                    letterSpacing: "-0.01em",
                                    fontWeight: "700",
                                },
                            ],
                        },
                    },
                },
            };
        </script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
            .shadow-soft {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
            .inset-shadow-soft {
                box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            }
        </style>
    </head>
    <body
        class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md antialiased p-margin-mobile md:p-margin-desktop relative overflow-hidden"
    >
        <!-- Decorative background elements -->
        <div
            class="absolute top-[-10%] left-[-5%] w-96 h-96 bg-primary/10 rounded-full blur-[100px] pointer-events-none"
        ></div>
        <div
            class="absolute bottom-[-10%] right-[-5%] w-[500px] h-[500px] bg-secondary/5 rounded-full blur-[120px] pointer-events-none"
        ></div>
        <main class="w-full max-w-md relative z-10">
            <div
                class="bg-surface-container-lowest rounded-[32px] shadow-soft border border-outline-variant/20 p-lg md:p-xl flex flex-col gap-lg"
            >
                <!-- Header Section -->
                <div class="text-center flex flex-col items-center gap-sm">
                    <div
                        class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-sm shadow-soft"
                    >
                        <span
                            class="material-symbols-outlined text-on-primary-container text-[32px]"
                            style="font-variation-settings: &quot;FILL&quot; 1"
                            >restaurant_menu</span
                        >
                    </div>
                    <h1
                        class="font-headline-lg text-headline-lg text-on-surface"
                    >
                        Zubora Kitchen
                    </h1>
                    <p
                        class="font-body-md text-body-md text-on-surface-variant"
                    >
                        Create your account to start organizing your culinary
                        life.
                    </p>
                </div>
                <!-- Form Section -->
                <form class="flex flex-col gap-md">
                    <!-- Name Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface px-1"
                            for="name"
                            >User Name</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >person</span
                            >
                            <input
                                class="w-full bg-surface-container border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="name"
                                name="name"
                                placeholder="Alex Chef"
                                required=""
                                type="text"
                            />
                        </div>
                    </div>
                    <!-- Email Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface px-1"
                            for="email"
                            >Email Address</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >mail</span
                            >
                            <input
                                class="w-full bg-surface-container border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="email"
                                name="email"
                                placeholder="alex@example.com"
                                required=""
                                type="email"
                            />
                        </div>
                    </div>
                    <!-- Password Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface px-1"
                            for="password"
                            >Password</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >lock</span
                            >
                            <input
                                class="w-full bg-surface-container border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required=""
                                type="password"
                            />
                        </div>
                    </div>
                    <!-- Password Confirmation Field -->
                    <div class="flex flex-col gap-xs">
                        <label
                            class="font-label-md text-label-md text-on-surface px-1"
                            for="password_confirmation"
                            >Confirm Password</label
                        >
                        <div class="relative flex items-center">
                            <span
                                class="material-symbols-outlined absolute left-md text-on-surface-variant"
                                >verified_user</span
                            >
                            <input
                                class="w-full bg-surface-container border border-outline-variant rounded-xl py-sm pl-[48px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none inset-shadow-soft transition-colors"
                                id="password_confirmation"
                                name="password_confirmation"
                                placeholder="••••••••"
                                required=""
                                type="password"
                            />
                        </div>
                    </div>
                    <!-- Action Button -->
                    <button
                        class="w-full bg-primary text-on-primary font-label-md text-label-md py-[14px] px-lg rounded-xl mt-sm hover:bg-primary-fixed hover:text-on-primary-fixed active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-lg"
                        type="submit"
                    >
                        Create Account
                        <span class="material-symbols-outlined text-[20px]"
                            >arrow_forward</span
                        >
                    </button>
                </form>
                <!-- Footer Links -->
                <div class="text-center mt-xs">
                    <p
                        class="font-body-md text-body-md text-on-surface-variant"
                    >
                        Already have an account?
                        <a
                            class="font-label-md text-label-md text-secondary hover:text-secondary-fixed transition-colors ml-xs underline underline-offset-4 decoration-secondary/30"
                            href="#"
                            >Log in here</a
                        >
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
